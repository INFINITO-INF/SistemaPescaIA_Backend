[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -rP
log_cli = true
log_cli_level = INFO
log_level = INFO
log_format = [%(asctime)s] [%(levelname)s] %(message)s
log_date_format = %H:%M:%S
markers =
    unit: Casos de prueba unitarios (lógica pura sin base de datos)
    integration: Casos de prueba de integración (módulos Python + SQL Server)
    acceptance: Pruebas de aceptación del cliente/administrador (CA001 a CA030 vía API)